# Default configuration for training a PPO agent on the 2D rendezvous task.
# Lengths are in metres, velocities in m/s, times in seconds.

environment:
  # Target orbit: circular, low Earth orbit at 400 km altitude.
  # The mean motion is n = sqrt(mu / a^3).
  semi_major_axis: 6778.0e3
  mu: 3.986004418e14

  # Chaser spacecraft.
  mass: 500.0
  max_thrust: 1.0          # N, per axis limit on the commanded thrust

  # Integration.
  time_step: 1.0           # s, one environment step
  max_episode_steps: 2000

  # Initial condition: the chaser starts somewhere on this annulus,
  # with a small random relative velocity.
  initial_radius_range: [80.0, 200.0]
  initial_velocity_scale: 0.05

  # Terminal conditions.
  docking_radius: 1.0          # m, close enough to count as a rendezvous
  docking_speed: 0.05          # m/s, and slow enough not to crash into it
  max_distance: 500.0          # m, beyond this the episode is a failure

rewards:
  distance_weight: 1.0e-2      # shaping term on the closing distance
  fuel_weight: 1.0e-3          # penalty on the commanded thrust
  success_bonus: 100.0
  failure_penalty: -100.0

training:
  algorithm: PPO
  total_timesteps: 2_000_000
  seed: 0
  n_envs: 8
  policy: MlpPolicy
  policy_kwargs:
    net_arch: [64, 64]
  learning_rate: 3.0e-4
  n_steps: 1024
  batch_size: 256
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0

live_view:
  enabled: true
  episode_stride: 50           # draw one rollout every N episodes
  trail_length: 300            # how many past positions to keep on screen
