[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "orbital-rendezvous"
version = "0.1.0"
description = "A reinforcement learning agent that performs an orbital rendezvous in the Clohessy-Wiltshire relative frame."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Lorenzo Monti", email = "monti.lorenzo00@gmail.com" }]
keywords = ["reinforcement-learning", "orbital-mechanics", "rendezvous", "gymnasium", "ppo"]

dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "torch>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
play = [
    "pygame>=2.5",
]

[project.urls]
Homepage = "https://github.com/LoreMonti/Orbital_Rendezvous"

[tool.hatch.build.targets.wheel]
packages = ["src/orbital_rendezvous"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
